# XcodeGen spec — the source of truth for SendToAlexa.xcodeproj.
# After changing this file (or adding/removing source files) run:  make project
name: SendToAlexa

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  AlexaKit:
    path: AlexaKit

targets:
  # ---------------------------------------------------------------- iOS app
  SendToAlexa-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/App
      - path: Shared/App
      - path: Shared/Common
    dependencies:
      - package: AlexaKit
        product: AlexaKit
      - target: ShareExtension-iOS
    settings:
      base:
        PRODUCT_NAME: SendToAlexa
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SendToAlexa
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Send to Alexa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/SendToAlexa.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)

  # ---------------------------------------------------- iOS share extension
  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/ShareExtension
      - path: Shared/Common
    dependencies:
      - package: AlexaKit
        product: AlexaKit
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SendToAlexa.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: iOS/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Send to Alexa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Show up for anything with one web URL (Apple Music, Safari, ...) or plain text.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: iOS/ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)

  # -------------------------------------------------------------- macOS app
  SendToAlexa-macOS:
    type: application
    platform: macOS
    sources:
      - path: macOS/App
      - path: Shared/App
      - path: Shared/Common
    dependencies:
      - package: AlexaKit
        product: AlexaKit
      - target: ShareExtension-macOS
    settings:
      base:
        PRODUCT_NAME: Send to Alexa
        PRODUCT_MODULE_NAME: SendToAlexa
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SendToAlexa.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: macOS/App/Info.plist
      properties:
        CFBundleDisplayName: Send to Alexa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: macOS/App/SendToAlexa.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)

  # -------------------------------------------------- macOS share extension
  ShareExtension-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: macOS/ShareExtension
      - path: Shared/Common
    dependencies:
      - package: AlexaKit
        product: AlexaKit
    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SendToAlexa.mac.ShareExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Send to Alexa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: macOS/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(SHARED_KEYCHAIN_GROUP)

schemes:
  SendToAlexa-iOS:
    build:
      targets:
        SendToAlexa-iOS: all
        ShareExtension-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  SendToAlexa-macOS:
    build:
      targets:
        SendToAlexa-macOS: all
        ShareExtension-macOS: all
    run:
      config: Debug
    archive:
      config: Release
